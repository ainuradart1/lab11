name: CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/cloud-app:1.0 .

      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/cloud-app:1.0

      - name: Deploy
        run: |
          docker run -d -p 5000:5000 --name cloud-app ${{ secrets.DOCKER_USERNAME }}/cloud-app:1.0
          sleep 10
          curl http://localhost:5000
